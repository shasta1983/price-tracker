version: '3.8'

services:
  # 1. Base de datos Relacional
  postgres:
    image: postgres:16-alpine
    container_name: pt-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Mensajería y Caché)
  redis:
    image: redis:7-alpine
    container_name: pt-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend Core (Spring Boot)
  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: pt-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      INTERNAL_TOKEN: ${INTERNAL_SHARED_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # 4. Scraper Worker (Python)
  worker-python:
    build:
      context: ./worker-python
      dockerfile: Dockerfile
    container_name: pt-worker
    restart: always
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_BOOT_WEBHOOK_URL: http://backend-spring:8080/api/internal/prices/callback
      INTERNAL_TOKEN: ${INTERNAL_SHARED_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      backend-spring:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: